version: 2

# Mises à jour de dépendances automatiques, regroupées pour limiter le bruit :
# une PR hebdomadaire pour les mineures et patch, les majeures restant isolées
# pour être relues une par une.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      dependances:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
