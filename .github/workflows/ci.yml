name: CI

# Build, analyse statique et tests du serveur/client FTP (natif + WebAssembly).
# Sert de barrière : rien ne rejoint main sans passer au vert.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Build WebAssembly
        working-directory: cmd/wasm
        run: GOOS=js GOARCH=wasm go build -o /dev/null .
